<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>테니스 잡아줘</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <section id="invitePanel" class="panel hidden">
        <h1>🎾 테니스 잡아줘</h1>
        <h2>Closed Beta</h2>
        <form id="inviteForm">
          <label class="date-field">
            <span>초대코드</span>
            <input type="text" name="code" autocomplete="one-time-code" required />
          </label>
          <label class="date-field">
            <span>이름 또는 별명</span>
            <input type="text" name="name" autocomplete="nickname" />
          </label>
          <button type="submit" class="primary">시작하기</button>
          <p id="inviteStatus" role="status"></p>
        </form>
      </section>

      <div id="appContent" class="hidden">
        <header>
          <h1>테니스 잡아줘</h1>
        </header>

        <section id="telegramPanel" class="panel hidden">
          <h2>텔레그램 알림 연결</h2>
          <p>텔레그램 알림을 연결해주세요.</p>
          <button id="connectTelegram" type="button">텔레그램 연결하기</button>
        </section>

        <section class="status-panel" aria-live="polite">
        <div>
          <span>마지막 조회</span>
          <strong id="lastChecked">-</strong>
        </div>
        <div>
          <span>다음 조회 예정</span>
          <strong id="nextCheck">-</strong>
        </div>
        <div>
          <span>강일</span>
          <strong id="gangilStatus">대기 중</strong>
          <a id="gangilLink" class="reservation-link" target="_blank" rel="noopener noreferrer">예약 사이트 ↗</a>
        </div>
        <div>
          <span>명일</span>
          <strong id="myeongilStatus">대기 중</strong>
          <a id="myeongilLink" class="reservation-link" target="_blank" rel="noopener noreferrer">예약 사이트 ↗</a>
        </div>
        <div>
          <span>올림픽</span>
          <strong id="olympicStatus">대기 중</strong>
          <a id="olympicLink" class="reservation-link" target="_blank" rel="noopener noreferrer">예약 사이트 ↗</a>
        </div>
        <div>
          <span>송파</span>
          <strong id="songpaStatus">대기 중</strong>
          <a id="songpaLink" class="reservation-link" target="_blank" rel="noopener noreferrer">예약 사이트 ↗</a>
        </div>
        </section>

        <form id="watchForm" class="panel">
        <fieldset>
          <legend>테니스장</legend>
          <div id="venueGroups" class="venue-groups"></div>
          <p id="venueSelectionHelp" class="venue-help"></p>
        </fieldset>

        <label class="date-field">
          <span>날짜</span>
          <input type="date" name="date" required />
        </label>

        <fieldset>
          <legend id="timeSlotsLegend">시간대</legend>
          <div id="timeSlots" class="slot-grid"></div>
        </fieldset>

        <button type="submit" class="primary">빈자리 알림 받기</button>
        <p id="status" role="status"></p>
        </form>

        <section>
          <h2>등록된 알림 조건</h2>
          <div id="watches" class="watch-list"></div>
        </section>

        <section>
          <h2>로그</h2>
          <div id="logs" class="logs"></div>
        </section>

        <section id="testTools" class="test-tools hidden">
          <h2>테스트</h2>
          <button id="fakeAvailability" type="button">가상 빈자리 발생</button>
        </section>
      </div>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
